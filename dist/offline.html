<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4ca883">
    <title>Local Chat — Offline</title>
    <style>
        :root { color-scheme: dark; font-family: system-ui, sans-serif; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: #eef5f1; background: #080a0a; }
        main { width: min(420px, calc(100% - 40px)); padding: 28px; border: 1px solid #26312d; border-radius: 14px; background: #131716; }
        h1 { margin: 0 0 12px; font-size: 24px; }
        p { margin: 0; color: #aab8b1; line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <h1>Local Chat is offline</h1>
        <p>Reconnect and reload the app to continue.</p>
    </main>
</body>
</html>
