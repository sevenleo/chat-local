<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-mark">◆</span>
            Local AI Chat
        </div>

        <div class="header-buttons">
            <button id="checkModel" class="header-button">Test model</button>
            <button id="downloadModel" class="header-button">Download model</button>
        </div>

        <span id="status" class="status status--idle">Initializing...</span>
    </header>

    <main id="chat"></main>

    <footer>
        <div id="input-area">
            <textarea id="prompt" rows="1" placeholder="Send a message..."></textarea>
            <button id="send" disabled>Send</button>
            <button id="stop">Stop</button>
        </div>
    </footer>

    <script defer src="app.js"></script>

</body>
</html>
