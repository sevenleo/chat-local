<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Local AI Chat</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css?v=1.11.1">
</head>
<body>

    <div id="appShell">
        <header>
            <div class="brand">
                <span class="brand-mark">◆</span>
                <span>Local AI Chat</span>
            </div>

            <div class="header-actions">
                <span id="status" class="status status--idle">Initializing...</span>
                <button id="menuToggle" class="menu-toggle" type="button"
                        aria-expanded="false" aria-controls="sideMenu" aria-label="Open menu"
                        title="Open menu">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </button>
            </div>
        </header>

        <main id="chat"></main>

        <footer>
            <div id="composer">
                <div id="attachments" hidden></div>

                <div id="input-area">
                    <div id="tools">
                        <button id="imageBtn" class="tool-btn" type="button"
                                title="Add image" aria-label="Add image">🖼️</button>
                        <button id="audioBtn" class="tool-btn" type="button"
                                title="Add audio" aria-label="Add audio">🎵</button>
                        <label id="ocrToggle" class="tool-toggle" hidden>
                            <input type="checkbox" id="ocrOnly"> OCR
                        </label>
                        <label id="transToggle" class="tool-toggle" hidden>
                            <input type="checkbox" id="transcribeOnly"> Transcribe
                        </label>
                    </div>

                    <textarea id="prompt" rows="1" placeholder="Text / image / audio / drop an drop"></textarea>

                    <div id="actions">
                        <button id="send" disabled>Send</button>
                        <button id="clearQueue" hidden title="Cancel all queued messages">Clear queue</button>
                        <button id="stop">Stop</button>
                    </div>
                </div>

                <input type="file" id="imageInput" accept="image/*" multiple hidden>
                <input type="file" id="audioInput" accept="audio/*" multiple hidden>
                <input type="file" id="importInput" accept=".json,application/json" hidden>
            </div>

            <div id="sysStats" class="sys-stats" hidden title="Browser metrics and optional server metrics">
                <span id="statBrowserCpu" class="stat stat--na">FPS …</span>
                <span id="statBrowserMem" class="stat stat--na">TAB …</span>
                <span id="statCpu" class="stat" hidden>CPU …</span>
                <span id="statMem" class="stat" hidden>RAM …</span>
                <span id="statGpu" class="stat" hidden>GPU …</span>
                <span id="statVram" class="stat" hidden>VRAM …</span>
            </div>
        </footer>
    </div>

    <aside id="sideMenu" class="side-menu" aria-labelledby="menuTitle" aria-hidden="true">
        <div class="side-menu__header">
            <div>
                <p class="eyebrow">Controls</p>
                <h2 id="menuTitle">Menu</h2>
            </div>
            <button id="menuClose" class="menu-close" type="button" aria-label="Close menu" title="Close menu">×</button>
        </div>

        <div class="menu-actions">
            <button id="checkModel" class="menu-action" type="button">
                <span class="menu-action__label">Test model</span>
                <span class="menu-action__icon" aria-hidden="true">↗</span>
            </button>
            <button id="downloadModel" class="menu-action" type="button">
                <span class="menu-action__label">Download model</span>
                <span class="menu-action__icon" aria-hidden="true">↓</span>
            </button>
            <button id="exportBtn" class="menu-action" type="button" disabled title="Save conversation as JSON">
                <span class="menu-action__label">Export</span>
                <span class="menu-action__icon" aria-hidden="true">↑</span>
            </button>
            <button id="importBtn" class="menu-action" type="button" title="Load a conversation JSON">
                <span class="menu-action__label">Import</span>
                <span class="menu-action__icon" aria-hidden="true">＋</span>
            </button>
        </div>

        <div class="menu-divider"></div>

        <label class="settings-toggle" for="statsToggle">
            <span>
                <span class="settings-toggle__title">Show performance metrics</span>
                <span class="settings-toggle__hint">Footer metrics and status collection</span>
            </span>
            <input type="checkbox" id="statsToggle" checked>
        </label>
    </aside>

    <script defer src="chat-logic.js?v=1.11.1"></script>
    <script defer src="app.js?v=1.11.1"></script>
    <script defer src="sysstats.js?v=1.11.1"></script>

</body>
</html>
