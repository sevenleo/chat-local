<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local AI Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #212121;
            color: white;

            display: flex;
            flex-direction: column;

            height: 100vh;
        }


        /* =========================
   HEADER
========================= */

        header {

            height: 60px;

            display: flex;
            align-items: center;

            padding: 0 20px;

            border-bottom: 1px solid #444;

            font-weight: bold;

            gap: 8px;
        }


        /* BOTÕES DISCRETOS */

        .header-buttons {

            display: flex;

            gap: 6px;

            margin-left: 20px;
        }


        .header-button {

            padding: 5px 9px;

            border: 1px solid #555;

            border-radius: 6px;

            background: transparent;

            color: #aaa;

            font-size: 12px;

            cursor: pointer;
        }


        .header-button:hover {

            background: #303030;

            color: white;

        }


        .header-button:disabled {

            opacity: 0.4;

            cursor: not-allowed;

        }


        /* STATUS */

        #status {

            margin-left: auto;

            font-size: 13px;

            color: #aaa;

        }


        /* =========================
   CHAT
========================= */

        #chat {

            flex: 1;

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 30px;

            overflow-y: auto;

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .message {

            display: flex;

            gap: 12px;

            line-height: 1.6;

            max-width: 100%;
        }


        .avatar {

            width: 35px;

            height: 35px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 6px;

            font-size: 12px;

            font-weight: bold;
        }


        .user .avatar {

            background: #555;

        }


        .ai .avatar {

            background: #10a37f;

        }


        .content {

            white-space: pre-wrap;

            word-break: break-word;

            padding-top: 5px;
        }


        .user {

            align-self: flex-end;

            flex-direction: row-reverse;
        }


        .user .content {

            background: #303030;

            padding: 12px 16px;

            border-radius: 15px;
        }


        /* =========================
   FOOTER
========================= */

        footer {

            border-top: 1px solid #444;

            padding: 15px;

            background: #212121;
        }


        #input-area {

            max-width: 900px;

            margin: auto;

            display: flex;

            gap: 10px;
        }


        textarea {

            flex: 1;

            resize: none;

            min-height: 50px;

            max-height: 150px;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #555;

            background: #303030;

            color: white;

            font-size: 15px;
        }


        textarea:focus {

            outline: none;

            border-color: #777;
        }


        button {

            padding: 0 20px;

            border: none;

            border-radius: 10px;

            background: #10a37f;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }


        button:hover {

            opacity: 0.9;
        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* STOP */

        #stop {

            background: #c0392b;

            display: none;
        }
    </style>

</head>


<body>


    <header>

        🤖 Local AI Chat


        <div class="header-buttons">

            <button id="checkModel" class="header-button">
                Test model
            </button>


            <button id="downloadModel" class="header-button">
                Download model
            </button>

        </div>


        <span id="status">
            Initializing...
        </span>

    </header>



    <div id="chat">


        <div class="message ai">

            <div class="avatar">
                AI
            </div>

            <div class="content">
                Hello! I am running locally using Chrome Built-in AI.
            </div>

        </div>


    </div>



    <footer>

        <div id="input-area">


            <textarea id="prompt" placeholder="Send a message..."></textarea>


            <button id="send" disabled>
                Send
            </button>


            <button id="stop">
                Stop
            </button>


        </div>

    </footer>



    <script>


        /* =========================
           VARIABLES
        ========================= */

        let session = null;

        let controller = null;

        let generating = false;


        const chat =
            document.getElementById("chat");


        const promptInput =
            document.getElementById("prompt");


        const sendButton =
            document.getElementById("send");


        const stopButton =
            document.getElementById("stop");


        const status =
            document.getElementById("status");


        const checkModelButton =
            document.getElementById("checkModel");


        const downloadModelButton =
            document.getElementById("downloadModel");



        /* =========================
           CHECK MODEL
        ========================= */

        async function checkModel() {

            try {

                status.textContent =
                    "Checking model...";


                const availability =
                    await LanguageModel.availability({

                        expectedOutputs: [

                            {
                                type: "text",

                                languages: ["en"]
                            }

                        ]

                    });


                console.log(
                    "Model availability:",
                    availability
                );


                switch (availability) {


                    case "available":

                        status.textContent =
                            "Model available";

                        sendButton.disabled =
                            false;

                        return;


                    case "downloadable":

                        status.textContent =
                            "Model not downloaded";

                        return;


                    case "downloading":

                        status.textContent =
                            "Model is downloading...";

                        return;


                    case "unavailable":

                        status.textContent =
                            "Model unavailable";

                        sendButton.disabled =
                            true;

                        return;


                    default:

                        status.textContent =
                            availability;

                }

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Error checking model";

            }

        }



        /* =========================
           DOWNLOAD MODEL
        ========================= */

        async function downloadModel() {

            try {

                downloadModelButton.disabled =
                    true;

                checkModelButton.disabled =
                    true;


                status.textContent =
                    "Starting download...";


                /*
                Criar uma sessão provoca
                o download caso o modelo
                ainda não esteja instalado.
                */

                session =
                    await LanguageModel.create({

                        expectedOutputs: [

                            {
                                type: "text",

                                languages: ["en"]
                            }

                        ],


                        monitor(monitor) {

                            monitor.addEventListener(

                                "downloadprogress",

                                event => {

                                    const percent =
                                        Math.round(
                                            event.loaded * 100
                                        );


                                    status.textContent =
                                        `Downloading model: ${percent}%`;

                                }

                            );

                        }

                    });


                status.textContent =
                    "Model ready";


                sendButton.disabled =
                    false;


                console.log(
                    "Model downloaded:",
                    session
                );


            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Download error";

            }

            finally {

                downloadModelButton.disabled =
                    false;

                checkModelButton.disabled =
                    false;

            }

        }



        /* =========================
           CREATE MESSAGE
        ========================= */

        function createMessage(
            type,
            text = ""
        ) {

            const message =
                document.createElement("div");


            message.className =
                `message ${type}`;


            const avatar =
                document.createElement("div");


            avatar.className =
                "avatar";


            avatar.textContent =

                type === "user"
                    ? "You"
                    : "AI";


            const content =
                document.createElement("div");


            content.className =
                "content";


            content.textContent =
                text;


            message.appendChild(
                avatar
            );


            message.appendChild(
                content
            );


            chat.appendChild(
                message
            );


            chat.scrollTop =
                chat.scrollHeight;


            return content;

        }



        /* =========================
           SEND MESSAGE
        ========================= */

        async function sendMessage() {

            const prompt =
                promptInput.value.trim();


            if (
                !prompt ||
                !session ||
                generating
            ) {

                return;

            }


            generating =
                true;


            createMessage(
                "user",
                prompt
            );


            promptInput.value =
                "";


            promptInput.disabled =
                true;


            sendButton.disabled =
                true;


            stopButton.style.display =
                "block";


            status.textContent =
                "Thinking...";


            const aiMessage =
                createMessage(
                    "ai",
                    ""
                );


            controller =
                new AbortController();


            try {


                const stream =
                    session.promptStreaming(

                        prompt,

                        {
                            signal:
                                controller.signal
                        }

                    );


                let respostaCompleta =
                    "";

                let respostaAnterior =
                    "";


                for await (
                    const chunk of stream
                ) {


                    /*
                    Suporta tanto chunks
                    incrementais quanto chunks
                    acumulados.
                    */

                    if (
                        chunk.startsWith(
                            respostaAnterior
                        )
                    ) {

                        respostaCompleta =
                            chunk;

                    }

                    else {

                        respostaCompleta +=
                            chunk;

                    }


                    respostaAnterior =
                        respostaCompleta;


                    aiMessage.textContent =
                        respostaCompleta;


                    chat.scrollTop =
                        chat.scrollHeight;

                }


                status.textContent =
                    "Model ready";

            }


            catch (error) {

                console.error(
                    "Generation error:",
                    error
                );


                if (
                    error.name === "AbortError"
                ) {

                    aiMessage.textContent +=
                        "\n\n[Generation stopped]";


                    status.textContent =
                        "Generation cancelled";

                }

                else {

                    aiMessage.textContent =
                        "Error: " +
                        error.message;


                    status.textContent =
                        "Generation error";

                }

            }


            finally {

                controller =
                    null;


                generating =
                    false;


                promptInput.disabled =
                    false;


                sendButton.disabled =
                    false;


                stopButton.style.display =
                    "none";


                promptInput.focus();

            }

        }



        /* =========================
           STOP
        ========================= */

        function stopGeneration() {

            if (controller) {

                controller.abort();

            }

        }



        /* =========================
           EVENTS
        ========================= */

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        stopButton.addEventListener(
            "click",
            stopGeneration
        );


        checkModelButton.addEventListener(
            "click",
            checkModel
        );


        downloadModelButton.addEventListener(
            "click",
            downloadModel
        );



        promptInput.addEventListener(

            "keydown",

            event => {

                if (
                    event.key === "Enter"
                    &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }

        );



        /* =========================
           INITIALIZATION
        ========================= */

        checkModel();

    </script>


</body>

</html>
