<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Local AI Chat</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="brand">
            <span class="brand-mark">◆</span>
            Local AI Chat
        </div>

        <div class="header-buttons">
            <button id="checkModel" class="header-button">Test model</button>
            <button id="downloadModel" class="header-button">Download model</button>
            <button id="exportBtn" class="header-button" disabled title="Save conversation as JSON">Export</button>
            <button id="importBtn" class="header-button" title="Load a conversation JSON">Import</button>
        </div>

        <span id="status" class="status status--idle">Initializing...</span>
    </header>

    <main id="chat"></main>

    <footer>
        <div id="composer">
            <div id="attachments" hidden></div>

            <div id="input-area">
                <div id="tools">
                    <button id="imageBtn" class="tool-btn" type="button"
                            title="Add image" aria-label="Add image">🖼️</button>
                    <button id="audioBtn" class="tool-btn" type="button"
                            title="Add audio" aria-label="Add audio">🎵</button>
                    <label id="ocrToggle" class="tool-toggle" hidden>
                        <input type="checkbox" id="ocrOnly"> OCR
                    </label>
                    <label id="transToggle" class="tool-toggle" hidden>
                        <input type="checkbox" id="transcribeOnly"> Transcribe
                    </label>
                </div>

                <textarea id="prompt" rows="1" placeholder="Message… or paste / drop an image or audio"></textarea>

                <div id="actions">
                    <button id="send" disabled>Send</button>
                    <button id="clearQueue" hidden title="Cancel all queued messages">Clear queue</button>
                    <button id="stop">Stop</button>
                </div>
            </div>

            <input type="file" id="imageInput" accept="image/*" multiple hidden>
            <input type="file" id="audioInput" accept="audio/*" multiple hidden>
            <input type="file" id="importInput" accept=".json,application/json" hidden>
        </div>

        <div id="sysStats" class="sys-stats" hidden title="Browser metrics always shown; real system stats via server.py when available">
            <span id="statBrowserCpu" class="stat stat--na">CPU browser …</span>
            <span id="statBrowserMem" class="stat stat--na">MEM aba …</span>
            <span id="statCpu" class="stat" hidden>CPU …</span>
            <span id="statMem" class="stat" hidden>RAM …</span>
            <span id="statGpu" class="stat" hidden>GPU …</span>
            <span id="statVram" class="stat" hidden>VRAM …</span>
        </div>
    </footer>

    <script defer src="chat-logic.js"></script>
    <script defer src="app.js"></script>
    <script defer src="sysstats.js"></script>

</body>
</html>
